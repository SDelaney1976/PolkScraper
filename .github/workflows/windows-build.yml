name: Windows EXE build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller python-dateutil

      - name: Build Windows EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconsole --clean \
            --name "POLK County Scraper" \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --add-data "src/validator;validator" \
            src/app.py

      - name: Upload artifact (EXE bundle)
        uses: actions/upload-artifact@v4
        with:
          name: POLK-County-Scraper-windows
          path: dist/**
